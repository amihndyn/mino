name: mino
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI Components & Indicators
  percent_indicator: ^4.2.3
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  lottie: ^3.3.3
  qr_flutter: ^4.1.0
  google_fonts: ^8.0.2

  # State Management (Flutter BLoC dihapus agar fokus menggunakan Provider)
  provider: ^6.1.2
  dartz: ^0.10.1

  # Local Storage & Database
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Device Features & Utilities
  connectivity_plus: ^7.1.1
  image_picker: ^1.2.1
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  timer_count_down: ^2.2.2

  # Thermal Printer Hardware Integration
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.9

  # Authentication
  google_sign_in: ^6.2.2
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  
  # Code Generation untuk Aset & Fonts
  flutter_gen: ^5.10.0
  flutter_gen_runner: ^5.10.0

flutter:
  uses-material-design: true

  # Pendaftaran Aset folder
  assets:
    - assets/images/
    - assets/images/bg_login.svg
    - assets/icons/

  # Pendaftaran Font Lokal
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400